<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fungi Enoki · 蘑菇目錄 | Catálogo de Hongos</title>
<style>
  :root{
    --bg1:#F8F3E9; --bg2:#F2ECDF; --bg3:#EAE4D6;
    --ink:#3E3A2E; --ink2:#8A7A6A; --accent:#4A6B57; --gold:#D9A441;
    --card:rgba(255,255,255,0.80); --cardline:rgba(255,255,255,0.95);
    --shadow:0 6px 20px rgba(90,70,54,0.10); --ph:#F2E9DB;
    --footer1:#3E3A2E; --footer2:#2A261E; --ftext:#F2E8D8; --fsub:#CBBBA6; --fnote:#A99B88;
  }
  [data-theme="night"]{
    --bg1:#232E27; --bg2:#1E2821; --bg3:#19221C;
    --ink:#F0E6D6; --ink2:#B49B86; --accent:#7FA88C; --gold:#E4BC66;
    --card:rgba(255,255,255,0.10); --cardline:rgba(255,255,255,0.16);
    --shadow:0 6px 20px rgba(0,0,0,0.35); --ph:#2A352C;
    --footer1:#14100B; --footer2:#0D0A06; --ftext:#E8DCC8; --fsub:#9C8B74; --fnote:#7A6B58;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:-apple-system,'PingFang TC','PingFang SC','Microsoft YaHei','Noto Sans TC',sans-serif;
    background:linear-gradient(175deg,var(--bg1) 0%,var(--bg2) 60%,var(--bg3) 100%);
    color:var(--ink); min-height:100vh;
    transition:background .35s,color .35s;
  }
  .wrap{max-width:540px;margin:0 auto;padding:14px 18px 0 18px;position:relative;}
  .hidden{display:none!important;}

  /* 背景光斑 */
  .glow{position:fixed;border-radius:50%;pointer-events:none;z-index:0;}
  .glow.g1{left:-80px;top:220px;width:260px;height:260px;background:radial-gradient(circle,rgba(196,161,126,0.20) 0%,rgba(196,161,126,0) 70%);}
  .glow.g2{right:-80px;bottom:160px;width:250px;height:250px;background:radial-gradient(circle,rgba(124,154,127,0.18) 0%,rgba(124,154,127,0) 70%);}

  /* 顶部工具栏 */
  .toolbar{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .brandline{display:flex;align-items:center;gap:10px;}
  .brandline .logo{width:38px;height:38px;border-radius:50%;object-fit:cover;box-shadow:0 2px 8px rgba(90,70,54,0.14);}
  .brandline .bn{font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:700;letter-spacing:0.5px;color:var(--ink);}
  .tool-icons{display:flex;align-items:center;gap:6px;}
  .pill{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--cardline);border-radius:999px;padding:5px 9px;box-shadow:var(--shadow);backdrop-filter:none;}
  .pill svg{flex:none;}
  .pill .t{font-size:9.5px;font-weight:700;color:var(--ink2);}
  .size-pill{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--cardline);border-radius:999px;padding:5px 10px;box-shadow:var(--shadow);}
  .size-pill button{border:none;background:transparent;color:var(--ink);font-family:Georgia,serif;font-size:12px;font-weight:700;padding:1px 2px;cursor:pointer;}
  .size-pill button:active{transform:scale(.9);}

  /* 语言条 */
  .langrow{position:relative;z-index:1;margin-top:8px;display:flex;}
  .lang-pill{display:flex;align-items:center;gap:6px;width:fit-content;background:var(--card);border:1px solid var(--cardline);border-radius:999px;padding:5px 6px;box-shadow:var(--shadow);}
  .lang-pill button{border:none;background:transparent;font-family:inherit;font-size:11px;font-weight:600;color:var(--ink2);border-radius:999px;padding:6px 12px;cursor:pointer;transition:background .2s,color .2s;}
  .lang-pill button.on{background:var(--accent);color:#fff;}

  /* Hero 大图区 */
  .hero{position:relative;z-index:1;margin-top:14px;border-radius:30px;overflow:hidden;box-shadow:0 14px 36px rgba(60,50,40,0.22);aspect-ratio:4/3.05;max-height:360px;}
  .hero img{width:100%;height:100%;object-fit:cover;display:block;}
  .hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(32,38,30,0.28) 0%,rgba(32,38,30,0) 32%,rgba(24,28,22,0.72) 100%);}
  .hero .label{position:absolute;left:24px;top:22px;font-size:11px;font-weight:700;letter-spacing:2.5px;color:#F7EFE2;}
  .hero .box{position:absolute;left:24px;right:20px;bottom:20px;}
  .hero .t1{font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:700;letter-spacing:1px;color:#fff;line-height:1.12;}
  .hero .line{width:54px;height:3px;border-radius:99px;background:linear-gradient(90deg,var(--gold) 0%,rgba(217,164,65,0) 100%);margin-top:12px;}
  .hero .t2{font-size:12.5px;font-weight:500;color:#EFE4D0;margin-top:10px;}

  /* 产品网格 */
  .grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:22px;padding-bottom:20px;}
  .card{
    background:var(--card);border:1px solid var(--cardline);border-radius:26px;padding:14px 14px 16px 14px;
    box-shadow:var(--shadow);text-decoration:none;color:inherit;display:block;position:relative;
    transition:transform .18s,box-shadow .18s;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(90,70,54,0.16);}
  .card .ph{width:100%;aspect-ratio:1/1;border-radius:22px;overflow:hidden;background:var(--ph);box-shadow:0 4px 14px rgba(90,70,54,0.12);}
  .card .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s;}
  .card:hover .ph img{transform:scale(1.05);}
  .card .nm .es{font-family:Georgia,serif;font-size:13px;font-weight:700;letter-spacing:0.4px;color:var(--ink);text-align:center;margin-top:12px;}
  .card .nm .zh{font-size:14px;font-weight:600;color:var(--ink2);text-align:center;margin-top:2px;}
  .card .sold{position:absolute;right:12px;top:12px;font-size:10px;font-weight:700;color:#6B5B4B;background:rgba(255,255,255,0.96);border:1px solid #D9C9B6;border-radius:999px;padding:4px 11px;}

  /* 底部深色收尾 */
  footer{position:relative;z-index:1;margin:10px 0 18px 0;background:linear-gradient(150deg,var(--footer1) 0%,var(--footer2) 100%);border-radius:26px;padding:18px 20px;box-shadow:0 8px 24px rgba(40,36,28,0.24);text-align:center;}
  footer .fbrand{font-family:Georgia,serif;font-size:13.5px;font-weight:700;letter-spacing:1.5px;color:var(--ftext);}
  footer .fmail{font-size:11.5px;color:var(--fsub);margin-top:5px;}
  footer .fmail a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--fsub);}
  footer .dots{margin-top:9px;}
  footer .dots i{display:inline-block;width:6px;height:6px;border-radius:50%;margin:0 4px;}
  footer .fnote{font-size:11px;color:var(--fnote);margin-top:7px;}

  /* 维护模式卡片 */
  .maint-card{max-width:440px;margin:60px auto;text-align:center;background:var(--card);border:1px solid var(--cardline);border-radius:26px;padding:40px 28px;box-shadow:var(--shadow);position:relative;z-index:1;}
  .maint-card .m1{font-size:22px;font-weight:800;}
  .maint-card .m2{margin-top:12px;font-size:14px;color:var(--ink2);line-height:1.7;}
  .maint-card .m2 a{color:var(--accent);}

  @media (max-width:420px){
    .hero .t1{font-size:28px;}
    .hero .label{left:18px;top:18px;}
    .hero .box{left:18px;bottom:16px;}
    .grid{gap:12px;}
    .card .nm .es{font-size:12px;}
    .card .nm .zh{font-size:12.5px;}
  }
</style>
</head>
<body>
<div class="glow g1"></div>
<div class="glow g2"></div>

<div id="maintPage" class="hidden">
  <div class="maint-card">
    <div data-l="maintTitle" class="m1">網站暫時關閉</div>
    <div data-l="maintText" class="m2">我們正在休息整理中，歡迎稍後再來。如有任何問題，歡迎來信：<br><a href="mailto:fungienoki@gmail.com">fungienoki@gmail.com</a></div>
  </div>
</div>

<div id="sitePage">
  <div class="wrap">

    <!-- 顶部工具栏 -->
    <div class="toolbar">
      <div class="brandline">
        <img class="logo" src="https://aka.doubaocdn.com/s/BOaOq0jgnV" alt="Fungi Enoki Logo">
        <span class="bn">Fungi Enoki</span>
      </div>
      <div class="tool-icons">
        <div class="pill">
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="#D9A441"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M5 19l2-2" stroke="#D9A441" stroke-width="1.8"/></svg>
          <span class="t" data-l="day">日</span>
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13A8.5 8.5 0 0 1 11 3a8.5 8.5 0 1 0 10 10z" fill="#5A6B7A"/></svg>
        </div>
        <div class="size-pill">
          <button onclick="setSize(-1)" title="縮小字體">A−</button>
          <button onclick="setSize(1)" title="放大字體">A+</button>
        </div>
      </div>
    </div>

    <!-- 语言条 -->
    <div class="langrow">
      <div class="lang-pill" id="langPill">
        <button data-lang="zh-Hans" onclick="setLang('zh-Hans')">简体</button>
        <button data-lang="zh-Hant" onclick="setLang('zh-Hant')">繁體</button>
        <button data-lang="es" onclick="setLang('es')">Es</button>
      </div>
    </div>

    <!-- 天：Hero 大图区 -->
    <div class="hero">
      <img src="https://aka.doubaocdn.com/s/dTvvuWWV3p" alt="Hongos frescos">
      <div class="shade"></div>
      <div class="label">HONGOS FRESCOS</div>
      <div class="box">
        <div class="t1" data-l="heroTitle">Nuestros<br>Productos</div>
        <div class="line"></div>
        <div class="t2" data-l="heroTip">扫描包装二维码 · 认识每一种蘑菇</div>
      </div>
    </div>

    <!-- 中：产品目录 -->
    <div class="grid" id="grid"></div>

  </div>

  <!-- 地：底部深色收尾 -->
  <footer>
    <div class="fbrand">FUNGI ENOKI</div>
    <div class="fmail" data-l="footMail">联系订购 · Pedidos: <a href="mailto:fungienoki@gmail.com">fungienoki@gmail.com</a></div>
    <div class="dots"><i style="background:#44464A;"></i><i style="background:#7E8A94;"></i><i style="background:#D9A441;"></i><i style="background:#D98A7F;"></i><i style="background:#C4A17E;"></i><i style="background:#D9B98C;"></i><i style="background:#8A6A52;"></i><i style="background:#A3543A;"></i></div>
    <div class="fnote" data-l="footNote">点任意菇 · 查看详细介绍</div>
  </footer>
</div>

<script>
// ===== 品种数据（13 在售 + 6 隐藏，隐藏不进总目录但有独立页面/QR）=====
var PRODUCTS = [
  {zh:"灰平菇", es:"Gírgolas Azules", img:"https://aka.doubaocdn.com/s/ucNNm8c1Rv", status:"show", page:"girgolas-azules.html"},
  {zh:"黑珍珠", es:"Perlas Negras", img:"https://aka.doubaocdn.com/s/brlfk91JT7", status:"show", page:"perlas-negras.html"},
  {zh:"珊瑚菇", es:"Gírgolas Doradas", img:"https://aka.doubaocdn.com/s/r72Bz2r8cU", status:"hide", page:"coral.html"},
  {zh:"粉紅玫瑰菇", es:"Gírgolas Rosadas", img:"https://aka.doubaocdn.com/s/7Uo0dsPSzF", status:"show", page:"rosadas.html"},
  {zh:"杏鮑菇", es:"Ostra Rey", img:"https://aka.doubaocdn.com/s/dTvvuWWV3p", status:"show", page:"ostra-rey.html"},
  {zh:"金針菇", es:"Enokitake", img:"https://aka.doubaocdn.com/s/5Qao97uo91", status:"show", page:"enoki.html"},
  {zh:"香菇", es:"Shiitake", img:"https://aka.doubaocdn.com/s/IXtaezmz2W", status:"show", page:"shiitake.html", soldout:true},
  {zh:"鴻禧菇", es:"Shimeji", img:"https://aka.doubaocdn.com/s/wHgPOnRFxb", status:"show", page:"shimeji.html"},
  {zh:"茶樹菇", es:"Pioppino", img:"https://aka.doubaocdn.com/s/LGECQIOdcy", status:"show", page:"pioppino.html"},
  {zh:"栗子蘑菇", es:"Hongo de Nuez", img:"https://aka.doubaocdn.com/s/LXmV55dwBv", status:"show", page:"nuez.html"},
  {zh:"滑子菇", es:"Nameko", img:"https://aka.doubaocdn.com/s/TkGtsjnR6V", status:"show", page:"nameko.html"},
  {zh:"灰樹花", es:"Maitake", img:"", status:"hide", page:"maitake.html"},
  {zh:"猴頭菇", es:"Melena de León", img:"https://aka.doubaocdn.com/s/KLOHSuBfaU", status:"show", page:"hericium.html"},
  {zh:"黑木耳", es:"Auricularia", img:"https://aka.doubaocdn.com/s/mTd1rhCJ4Z", status:"show", page:"auricularia.html"},
  {zh:"羊肚菌", es:"Morilla", img:"", status:"hide", page:"morilla.html"},
  {zh:"蟲草花", es:"Cordyceps militaris", img:"", status:"hide", page:"cordyceps.html"},
  {zh:"大球蓋菇", es:"Stropharia", img:"", status:"hide", page:"stropharia.html"},
  {zh:"雲芝", es:"Cola de Pavo", img:"", status:"hide", page:"trametes.html"},
  {zh:"靈芝", es:"Ganoderma lucidum", img:"https://aka.doubaocdn.com/s/MLbTdd3xn1", status:"show", page:"reishi.html"}
];

// ===== 维护模式开关（GitHub 上改 maintenance.json 的 "on":true/false）=====
fetch('maintenance.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
  if(d && d.on === true){ showMaint(); }
}).catch(function(){ /* 文件不存在 = 正常开放 */ });

function showMaint(){
  document.getElementById('sitePage').classList.add('hidden');
  document.getElementById('maintPage').classList.remove('hidden');
}

// ===== 语言字典 =====
var LANGS = {
  "day":{"zh-Hant":"日","zh-Hans":"日","es":"Día"},
  "heroTitle":{"zh-Hant":"我們的<br>產品","zh-Hans":"我们的<br>产品","es":"Nuestros<br>Productos"},
  "heroTip":{"zh-Hant":"掃描包裝二維碼 · 認識每一種蘑菇","zh-Hans":"扫描包装二维码 · 认识每一种蘑菇","es":"Escanee el código QR del envase · conozca cada hongo"},
  "footMail":{"zh-Hant":"聯繫訂購 · Pedidos: ","zh-Hans":"联系订购 · Pedidos: ","es":"Pedidos: "},
  "footNote":{"zh-Hant":"點任意菇 · 查看詳細介紹","zh-Hans":"点任意菇 · 查看详细介绍","es":"Toque cualquier hongo · ver detalle"},
  "maintTitle":{"zh-Hant":"網站暫時關閉","zh-Hans":"网站暂时关闭","es":"Sitio temporalmente cerrado"},
  "maintText":{"zh-Hant":"我們正在休息整理中，歡迎稍後再來。如有任何問題，歡迎來信：","zh-Hans":"我们正在休息整理中，欢迎稍后再来。如有任何问题，欢迎来信：","es":"Estamos descansando y organizando. Vuelva pronto. Ante cualquier consulta, escríbanos a:"},
  "soldout":{"zh-Hant":"暫停供貨","zh-Hans":"暂停供货","es":"Temporalmente agotado"}
};
function t(key,lang){ var m=LANGS[key]; return m? (m[lang]||m['zh-Hant']) : ''; }

// ===== 状态 =====
var LANG = 'zh-Hant';
var savedLang = localStorage.getItem('fe_lang');
if(savedLang) LANG = savedLang;
var THEME = localStorage.getItem('fe_theme') || 'day';
var SIZE = parseInt(localStorage.getItem('fe_size')||'0',10);

function renderGrid(){
  var g = document.getElementById('grid');
  g.innerHTML = '';
  PRODUCTS.forEach(function(p){
    if(p.status !== 'show') return;
    var a = document.createElement('a');
    a.className = 'card';
    a.href = p.page || '#';
    var imgHtml = p.img ? '<div class="ph"><img src="'+p.img+'" alt="'+p.es+'"></div>' : '<div class="ph"></div>';
    var sold = p.soldout ? '<div class="sold">'+t('soldout',LANG)+'</div>' : '';
    var zhShow = LANG==='es' ? p.zh : p.zh;
    var esShow = LANG==='es' ? p.es : p.es;
    a.innerHTML = imgHtml + sold + '<div class="nm"><div class="es">'+p.es+'</div><div class="zh">'+p.zh+'</div></div>';
    g.appendChild(a);
  });
}

function setLang(l){
  LANG = l; localStorage.setItem('fe_lang',l);
  document.querySelectorAll('#langPill button').forEach(function(b){ b.classList.toggle('on', b.dataset.lang===l); });
  document.querySelectorAll('[data-l]').forEach(function(el){
    var k=el.getAttribute('data-l');
    if(k==='heroTitle'){ el.innerHTML = t(k,l); } else { el.textContent = t(k,l); }
  });
}
function setSize(d){
  SIZE = Math.max(-2, Math.min(2, SIZE + d));
  localStorage.setItem('fe_size', SIZE);
  var fs = 100 + SIZE*8;
  document.body.style.fontSize = fs + '%';
}
function toggleTheme(){
  THEME = THEME==='day'?'night':'day';
  localStorage.setItem('fe_theme',THEME);
  document.documentElement.setAttribute('data-theme',THEME);
}

// 初始化
(function(){
  setLang(LANG);
  renderGrid();
  setSize(0);
  if(THEME==='night') toggleTheme();
  // 系统语言自动检测（繁/简/西）
  if(!savedLang){
    var sys = (navigator.language||'zh-TW').toLowerCase();
    if(sys.indexOf('es')===0) setLang('es');
    else if(sys.indexOf('zh')===0) setLang(sys.indexOf('cn')>=0||sys.indexOf('hans')>=0?'zh-Hans':'zh-Hant');
  }
})();
</script>
</body>
</html>
